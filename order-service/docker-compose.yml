version: '3'
services:
  db:
    image: mysql:8.0.28
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: order_mysql
      MYSQL_USER: order-user
      MYSQL_PASSWORD: tam12345678
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./order_trading.sql:/docker-entrypoint-initdb.d/order_trading.sql
    ports:
      - "3307:3306" # <host-port>:<container-port>
  zookeeper:
    image:  zookeeper:3.6.3
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - kafka-net
  cache:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - ./redis-data:/data

  kafka:
    image: confluentinc/cp-kafka:6.2.0
    container_name: kafka-order
    depends_on:
      - zookeeper
    ports:
      - "9093:9092" # host : container-port
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "topic1:1:1"
    volumes:
      - ./kafka-data:/var/lib/kafka/data
    networks:
      - kafka-net
networks:
  kafka-net:
    driver: bridge